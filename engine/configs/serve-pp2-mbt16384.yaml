# DeepSeek-V4.1-Flash-1017, PP2 x TP4 on 8x V100-SXM2-32GB (variant: 16,384-token prefill chunks; in testing, not production).
# Stage 1 = layers 0-19 with the Engram tables and hash state (board B, GPUs 0-3); stage 2 = layers 20-39, the
# head and the DSpark drafter (board C, GPUs 4-7). Split 20 is the only admissible split.
# Every expert resident on the GPUs (cold set of zero). Loopback only, no API key: put your own proxy in front.
# Synchronous scheduling, FULL CUDA graphs for 1-6 tokens per step, DSpark 5 drafts per round.
# Set ENGINE_HOME and MODEL_HOME (see docs/production.md); the lever switches live in rec.env.
model: ${ENGINE_HOME}/models/gguf/DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00001-of-00004.gguf
hf-config-path: ${MODEL_HOME}/base
tokenizer: ${MODEL_HOME}/base
tokenizer-mode: deepseek_v41
served-model-name: deepseek-v4.1-flash
host: 127.0.0.1
port: 18042
dtype: half
quantization: gguf
load-format: gguf
tensor-parallel-size: 4
pipeline-parallel-size: 2
max-model-len: 524288
max-num-seqs: 1
max-num-batched-tokens: 16384
kv-cache-memory-bytes: 268435456
gpu-memory-utilization: 0.96
no-enforce-eager: true
compilation-config:
  mode: 0
  cudagraph_mode: FULL
  cudagraph_capture_sizes: [1, 2, 3, 4, 5, 6]
  max_cudagraph_capture_size: 6
# This baseline's YAML loader omits false scalar flags; use explicit negations.
no-async-scheduling: true
enable-prefix-caching: true
enable-chunked-prefill: true
no-disable-custom-all-reduce: true
enable-auto-tool-choice: true
tool-call-parser: deepseek_v41
# Thinking on by default (R1-style <think>...</think>); a request can pass
# chat_template_kwargs {"thinking": false} or reasoning_effort.
reasoning-parser: deepseek_v4
default-chat-template-kwargs: '{"thinking": true}'
model-loader-extra-config:
  engram_path: ${ENGINE_HOME}/engram/DeepSeek-V4.1-Flash-Engram-IQ4_NL.gguf
speculative-config:
  method: dspark
  model: ${MODEL_HOME}/dspark-v41
  quantization: fp8
  num_speculative_tokens: 5
  draft_load_config:
    load_format: safetensors
  enforce_eager: false
kernel-config:
  sm70_ring:
    enabled: false
  sm70_gguf:
    expert_storage: original
    expert_arena: true
    expert_cache_host_storage: shared_original
    # Every expert resident: a cold set of zero takes no spare slots (P2 admits both).
    expert_cache_offload_fraction: 0
    expert_cache_spare_slots: 0
    expert_cache_fraction: 0
    expert_cache_host_slack: 0
    expert_load_prefetch_banks: 1
    expert_cache_prefill_tokens: 4096
    dense_storage: original
    embedding_storage: original
    prefill_min_m: 1
    dequant_workspace_bytes: 33554432
